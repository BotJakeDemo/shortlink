# .zurdo/config.toml — generated by `zurdo init`.
# Per-repo configuration for Zurdo. Edit freely; the comments are the docs.

# [roles.executor] — the provider that drives every task. The model is chosen
# per-task from [effort_map.<provider>], so no `model` key belongs here.
[roles.executor]
provider = "anthropic"          # or "codex"

# [roles.analyzer] — required for `zurdo analyze` and `zurdo heal`. Uses `model`
# directly; the effort map does not apply to the analyzer role.
[roles.analyzer]
provider = "anthropic"
model    = "claude-opus-5-5"

# [effort_map.anthropic] — maps a task's **Effort** value to an Anthropic model.
# See docs/providers/claude-code-cheat-sheet.md for the authoritative live model list.
[effort_map.anthropic]
low    = "claude-haiku-5-5"
medium = "claude-sonnet-5-5"
high   = "claude-opus-5-5"

# [effort_map.codex] — the matching Codex effort map. Keep the key set identical
# to the Anthropic block so PRDs stay portable when the executor is swapped.
# See docs/providers/codex-cheat-sheet.md for the authoritative live model list.
[effort_map.codex]
low    = "gpt-5.5"
medium = "gpt-5.5"
high   = "gpt-5.5"

# [effort_map.copilot] — the matching Copilot effort map. Keep the key set
# identical to the other blocks so PRDs stay portable when the executor is
# swapped. Copilot CLI uses dotted model ids (e.g. claude-sonnet-4.6) which
# differ from the claude CLI's dashed ids. `auto` lets the CLI pick the best
# available model on any plan; to pin per-tier models, edit the ids (dotted
# form, e.g. claude-sonnet-4.6) and verify them against this account with
# `zurdo doctor`. The /model command picker lists Copilot's
# *supported* catalog — a superset of what the plan's --model flag accepts —
# so an id appearing there does not mean it will work.
[effort_map.copilot]
low    = "auto"
medium = "auto"
high   = "auto"

# [skills]
# Extra directories searched (in addition to the provider's project and
# global discovery paths) when checking skills referenced by a PRD's
# **Skills**: lines. A missing skill is a warning, never an error.
# search_paths = ["~/my-team/skills"]

# [defaults] — run-wide attempt and iteration ceilings.
[defaults]
max_attempts         = 3        # used when a task omits **Max-Attempts**
max_total_iterations = 0        # global run budget; 0 means unlimited
parallel_criteria   = false    # set true only if every shell/http criterion is hermetic
analyzer_parallelism = 4        # concurrent analyzer LLM calls (1–16; 1 preserves the v1 sequential behavior)

# [timeouts] — verification and agent time limits, in seconds.
[timeouts]
criterion_seconds = 300         # per-check; applies to shell + http only
agent_seconds     = 1800        # used when a task omits **Agent-timeout**

# [providers.anthropic] — how to invoke the Anthropic CLI.
# Escape hatch for CLI-flag drift: cli may point at a wrapper script.
# See docs/providers/claude-code-cheat-sheet.md for the authoritative model list, flags, and env vars.
# See docs/providers/claude-code-cheat-sheet.md (Zurdo-side notes).
[providers.anthropic]
cli        = "claude"           # binary resolved on PATH
extra_args = []                 # appended after Zurdo's default args

# [providers.codex] — how to invoke the Codex CLI.
# Escape hatch for CLI-flag drift: cli may point at a wrapper script.
# See docs/providers/codex-cheat-sheet.md (Zurdo-side notes).
[providers.codex]
cli        = "codex"            # binary resolved on PATH
extra_args = []                 # appended after Zurdo's default args

# [providers.copilot] — how to invoke the GitHub Copilot CLI.
# Escape hatch for CLI-flag drift: cli may point at a wrapper script.
[providers.copilot]
cli        = "copilot"          # binary resolved on PATH
extra_args = []                 # appended after Zurdo's default args

# [pricing.<model>] — override per-model USD-per-million-tokens prices used
# by `cost_usd_est`. The built-in table covers every default-config model;
# add a block here to correct a stale rate, add a self-hosted alias, or apply
# a discount without rebuilding zurdo. `input` and `output` are required;
# `cache_write` and `cache_read` are optional and fall back to the table
# default when omitted. Negative values are rejected at load time.
# [pricing.claude-sonnet-4-6]
# input       = 3.00
# output      = 15.00
# cache_write = 3.75
# cache_read  = 0.30

# [pricing.copilot] — override the Copilot premium-request rate and per-model
# multipliers. Copilot bills `interactions × multiplier(model)` premium
# requests per invocation; the `default` multiplier covers `auto` and any
# unmapped id. An omitted `request_rate` keeps the built-in default.
# [pricing.copilot]
# request_rate = 0.04
#
# [pricing.copilot.multipliers]
# default            = 1.0
# "claude-haiku-4.5" = 0.33
# "claude-opus-4.1"  = 10.0

# [lumen] — code-indexing settings (spec §11.4). Lumen is off by default;
# set enabled = true to activate structural-hint resolution (§3.4). The
# recognized language names are: rust, python, go, typescript, javascript.
[lumen]
enabled          = true         # set true to activate Lumen code indexing
languages        = ["go"] 
max_file_bytes   = 2097152       # files larger than this (bytes) are skipped
gc_grace_minutes = 10            # generations older than this window are GC-eligible

# [experimental] — feature gates (spec §11.4). No gate is currently defined
# here; the table is kept as the home for future opt-in behavior.
[experimental]
# structural_hints is retired. Structural hints (§3.4) are governed solely by
# [lumen].enabled above. The key is still accepted so older configs keep
# loading, but it is ignored and warns on load.

# [vela] — file-watcher settings. Disabled by default; set enabled = true to
# activate the Vela watcher. idle_minutes controls the idle window before a
# run is triggered; debounce_ms dampens rapid filesystem events.
[vela]
enabled      = true
# idle_minutes = 30    # idle window before a watcher run is triggered
# debounce_ms  = 200   # debounce window for filesystem events

# [mcp] — inject Zurdo's own MCP server into the executor's argv so the agent
# can query the structural index instead of re-deriving it every iteration.
# Firing also requires [lumen].enabled = true. strict_claude_config passes
# --strict-mcp-config to the claude adapter, which suppresses every other MCP
# server the user configured elsewhere — keep it false unless you mean that.
[mcp]
inject_server         = true
strict_claude_config  = false

# [mcp.adapters] — per-provider injection gates. copilot defaults to false
# because third-party MCP servers are gated by organization policy there.
[mcp.adapters]
anthropic = true
codex     = true
copilot   = false
